<!DOCTYPE html>
<html>
<head>
    <title>Arrays</title>
</head>
<body>

<h1>Arrays</h1>
<div id="output"></div>

<script>
  const whiteRoses = ["York", "Leeds", "Sheffield"];
  
 
  const outputDiv = document.getElementById("output");

 
  for (let i = 0; i < whiteRoses.length; i++) {
    outputDiv.innerHTML += whiteRoses[i] + "<br>";
  }
</script>

</body>
</html>
